pre-commit:
  parallel: false
  commands:
    format:
      # Only format files actually staged for this commit — running prettier across the
      # whole repo would auto-stage unrelated working-tree drift via stage_fixed.
      # Calls bun directly rather than a make target: lefthook expands {staged_files}
      # unquoted, so make reads each extra filename as a build target.
      glob: '*.{ts,tsx,js,jsx,md,json,yaml,yml}'
      run: bun x prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      run: bun x eslint .
    scan-secrets:
      # --redact keeps the secret out of terminal scrollback; a finding still exits 1 and blocks
      # the commit. --staged catches it before it ever enters history, which pre-push cannot.
      run: gitleaks git --staged --redact
    actionlint:
      glob: '.github/workflows/*.yml'
      run: actionlint {staged_files}
    check-sources-sorted:
      # The README Sources table must stay alphabetical-by-country.
      # Three batches in a row landed entries in the wrong position; this catches
      # it before commit so the next forty entries stay sorted automatically.
      glob: '{README.md}'
      run: python3 scripts/check-sources-sorted.py

commit-msg:
  commands:
    commitlint:
      run: bun x commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun x tsc --noEmit -p tsconfig.eslint.json
    unit-tests:
      run: bun test --isolate --coverage
    # Backstop over full history (~0.7s): the pre-commit hook only sees the staged diff, so a
    # --no-verify commit, or anything committed before that hook existed, would reach the remote
    # unscanned. Nothing leaves the machine without this passing.
    scan-secrets-history:
      run: gitleaks git --redact --no-banner
