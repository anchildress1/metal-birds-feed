name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        # GitHub-owned actions intentionally follow the repository's major-tag update policy.
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      # Both also run in pre-commit, but a --no-verify commit or a web-UI edit bypasses hooks
      # entirely; AGENTS.md requires the sources table stay sorted, so CI is the real gate.
      - name: Validate sources table ordering
        run: python3 scripts/check-sources-sorted.py

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # refresh.yml runs dist/pipeline.js built by make build; tsc can exit 0 while
      # emitting nothing (noEmit config drift), so assert the artifact actually exists.
      - name: Build
        run: |
          make build
          test -f dist/pipeline.js

      - name: Unit tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube scan
        # SHA-pinned third-party action; SONAR_TOKEN is a GitHub-managed secret reference, not a
        # literal, so the flagged secret-exposure pattern does not apply here.
        # nosemgrep
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
