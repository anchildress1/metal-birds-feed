name: Deploy feed service

# The only job in this repo that deploys. Two callers reach it — release-please.yml on a release,
# refresh.yml when the daily register pull changes the merged feed — so the deploy steps, the
# credential scoping, and the _deployed.json bookkeeping exist once instead of drifting in two files.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to check out and deploy'
        required: true
        type: string
      force:
        description: 'Deploy even when the assembled feed already matches what is live'
        required: false
        default: false
        type: boolean
      expected_version:
        description: 'Version the checked-out package.json must carry; empty skips the check'
        required: false
        default: ''
        type: string
      expected_tag:
        description: 'Release tag, which must equal v<expected_version>; empty skips the check'
        required: false
        default: ''
        type: string
    secrets:
      MBF_R2_ACCOUNT_ID:
        required: true
      MBF_R2_ACCESS_KEY_ID:
        required: true
      MBF_R2_SECRET_ACCESS_KEY:
        required: true
      MBF_R2_BUCKET_NAME:
        required: true

# A constant, never `${{ github.workflow }}`: inside a called workflow that expression resolves to
# the CALLER's name, which would file a release deploy and a refresh deploy under different groups —
# the race this exists to prevent — and can cancel the caller. Queued rather than cancelled, because
# a deploy killed halfway leaves the service updated while _deployed.json still names the old hash.
concurrency:
  group: cloud-run-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy feed service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Callers can only downgrade these, never widen them, so the calling job must grant both.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Keyed on `force` — the release caller is the only forced one — rather than on the version
      # being non-empty. Skipping when the string is blank makes the check disable itself the moment
      # the upstream output stops arriving, which is the one failure it exists to catch; keyed this
      # way an absent version fails the release instead of waving it through.
      - name: Verify released version
        if: ${{ inputs.force }}
        env:
          RELEASE_TAG: ${{ inputs.expected_tag }}
          RELEASE_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          # Both must be present. An empty value would otherwise compare equal to an empty
          # package.json version, turning a broken upstream output into a silent pass.
          test -n "$RELEASE_VERSION"
          test -n "$RELEASE_TAG"
          package_version="$(jq -r '.version' package.json)"
          test "$package_version" = "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"

      # assemble-feed, not build-feed: the refresh matrix has already written every slice, and
      # build-feed would re-download all 15 registers. Emits `changed` and `hash` to $GITHUB_OUTPUT.
      - name: Assemble feed
        id: feed
        env:
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
        run: make assemble-feed

      - name: Authenticate to Google Cloud
        if: ${{ steps.feed.outputs.changed == 'true' || inputs.force }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        if: ${{ steps.feed.outputs.changed == 'true' || inputs.force }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: 576.0.0

      - name: Deploy feed service
        if: ${{ steps.feed.outputs.changed == 'true' || inputs.force }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_RUN_REGION || 'us-east1' }}
          SERVICE_NAME: ${{ vars.GCP_RUN_SERVICE || 'metal-birds-feed' }}
        run: make deploy-only

      # Advances the marker only after a successful deploy, so a failed one never suppresses the
      # next attempt.
      - name: Record deployed feed hash
        if: ${{ steps.feed.outputs.changed == 'true' || inputs.force }}
        env:
          FEED_HASH: ${{ steps.feed.outputs.hash }}
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
        run: bun run dist/mark-deployed.js "$FEED_HASH"
