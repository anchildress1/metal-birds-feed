name: Registry Refresh

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC; per-source cadence_days gates actual work
  workflow_dispatch:
    inputs:
      source:
        description: 'Source ID to refresh (e.g. faa). Leave blank to refresh all.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — map and diff, no R2 write and no translation pass (PDF sources still call Gemini)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Ignore cadence_days and refresh now (use with a named source)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  # Gemini RPM limits apply per project, not per ref. One shared group prevents a manual branch run
  # from overlapping the scheduled main run against the same project quota.
  group: registry-refresh-gemini
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.list.outputs.sources }}
      gemini_sources: ${{ steps.list.outputs.gemini_sources }}
    steps:
      - name: Checkout code
        # GitHub-owned actions intentionally follow the repository's major-tag update policy.
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: make build

      # The pipeline's own loader, so the split matches a local fleet refresh.
      - name: Enumerate sources
        id: list
        env:
          REFRESH_SOURCE: ${{ inputs.source }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: bun run dist/discover-sources.js

  refresh:
    needs: discover
    if: ${{ needs.discover.outputs.sources != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.sources) }}
    concurrency:
      group: refresh-${{ matrix.source }}
      cancel-in-progress: false # never cancel a running refresh mid-write

    steps: &refresh-steps
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: make build

      - name: Run refresh pipeline
        env:
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REQUESTS_PER_MINUTE: ${{ vars.GEMINI_REQUESTS_PER_MINUTE || '10' }}
          REFRESH_SOURCE: ${{ matrix.source }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run dist/pipeline.js

      - name: Upload refresh logs
        uses: actions/upload-artifact@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        if: always()
        with:
          name: refresh-logs-${{ matrix.source }}-${{ github.run_id }}
          path: logs/
          retention-days: 30

  refresh-gemini:
    needs: discover
    if: ${{ needs.discover.outputs.gemini_sources != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      # Each job paces at the full project RPM; parallel jobs draw 429s past the retry budget.
      max-parallel: 1
      matrix:
        source: ${{ fromJson(needs.discover.outputs.gemini_sources) }}
    concurrency:
      group: refresh-${{ matrix.source }}
      cancel-in-progress: false # never cancel a running refresh mid-write

    steps: *refresh-steps

  # A paused source is outside the matrix, so nothing above reads its state. Local runs (VPN,
  # `make ingest`) still move it, and this job opens or closes its staleness issue from that state
  # without fetching anything. A named dispatch is a single-source probe, so it skips this.
  paused-staleness:
    if: ${{ (inputs.source || '') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: make build

      - name: Evaluate paused-source staleness
        env:
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run dist/paused-staleness.js

  # Ships a register change on the day it lands. Calls the same reusable workflow the release path
  # uses, so there is one deploy definition with two entry points. force is false: the called
  # workflow assembles the feed and deploys only when the result differs from `_deployed.json`, so an
  # all-unchanged run costs one assemble and no deploy.
  # `!cancelled()`: a failed source reuses its prior slice. A failed discover only skips the
  # refresh jobs, which `!cancelled()` does not stop on; hence the explicit discover check.
  deploy:
    needs: [discover, refresh, refresh-gemini]
    if: ${{ !cancelled() && needs.discover.result == 'success' && github.ref_name == github.event.repository.default_branch && (inputs.dry_run || 'false') != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      force: false
    secrets:
      MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
      MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
      MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
      MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
