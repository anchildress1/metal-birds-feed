name: Registry Refresh

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC; per-source cadence_days gates actual work
  workflow_dispatch:
    inputs:
      source:
        description: 'Source ID to refresh (e.g. faa). Leave blank to refresh all.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — translate and diff but do not write to R2'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.list.outputs.sources }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enumerate sources
        id: list
        env:
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SOURCE" ]; then
            sources=$(jq -c -n --arg s "$INPUT_SOURCE" '[$s]')
          else
            sources=$(find sources -maxdepth 1 -name '*.yaml' -type f -print0 \
              | xargs -0 -n1 basename \
              | sed 's/\.yaml$//' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "Resolved sources: $sources"

  refresh:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.sources) }}
    concurrency:
      group: refresh-${{ matrix.source }}
      cancel-in-progress: false # never cancel a running refresh mid-write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: make build

      - name: Run refresh pipeline
        env:
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
          REFRESH_SOURCE: ${{ matrix.source }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run dist/pipeline.js

      - name: Upload refresh logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refresh-logs-${{ matrix.source }}-${{ github.run_id }}
          path: logs/
          retention-days: 90

  deploy-feed:
    needs: refresh
    if: github.ref_name == github.event.repository.default_branch && (inputs.dry_run || 'false') != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: 576.0.0

      - name: Build and deploy feed service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          MBF_R2_ACCOUNT_ID: ${{ secrets.MBF_R2_ACCOUNT_ID }}
          MBF_R2_ACCESS_KEY_ID: ${{ secrets.MBF_R2_ACCESS_KEY_ID }}
          MBF_R2_SECRET_ACCESS_KEY: ${{ secrets.MBF_R2_SECRET_ACCESS_KEY }}
          MBF_R2_BUCKET_NAME: ${{ secrets.MBF_R2_BUCKET_NAME }}
          REGION: ${{ vars.GCP_RUN_REGION || 'us-central1' }}
          SERVICE_NAME: ${{ vars.GCP_RUN_SERVICE || 'metal-birds-feed' }}
        run: make deploy
