id: hu-kh
label: Közlekedési Hatóság Magyarország Légijármű Lajstroma
country: HU
language: hu
encoding: utf8
trim_all: true
# No declared cadence; the observed republish rhythm is near-weekly (evidence in DATA_LICENSES.md).
cadence_days: 7

download:
  # Liferay builds this path from the document's ORIGINAL name, so the 2026-02-25 slug is not a
  # publication date: it serves whatever version is current, and `url` alone fetches the right file
  # today. Discovery re-reads the document page anyway, because the one failure this cannot survive
  # is silent: were the authority to re-upload the register as a NEW document, this path would keep
  # answering 200 with the superseded PDF, content_hash would report "unchanged", and nothing would
  # fail until the staleness threshold.
  #
  # Declaring discovery makes `url` unreachable — resolveDownloadUrl throws when the pattern misses,
  # it does not fall back — so page-markup drift now fails the refresh outright. That trade is the
  # point: a loud failure beats serving a superseded register behind a 200.
  url: https://kozlekedesihatosag.kormany.hu/documents/d/legugyi-felugyeleti-hatosagi-foosztaly/2026-02-25-frissites-?download=true
  format: file
  discover_url: https://www.kozlekedesihatosag.kormany.hu/hu/dokumentum/104604
  discover_pattern: 'href="(https://kozlekedesihatosag\.kormany\.hu/documents/d/legugyi-felugyeleti-hatosagi-foosztaly/[^"]+\?download=true)"'
  entries:
    register: register.pdf

primary: register
delimiter: ','
format: pdf

# Glyph runs put stray spaces around the hyphen ("HA - 742"): `\s*`, not `\s?`. Suffix: 3–4 chars.
pdf:
  mark_field: mark
  # "HU-16" prints inside HA-TWN's cell block and extracts as its own row, skipped below.
  mark_pattern: 'HA\s*-\s*[A-Z0-9]{3,4}|HU\s*-\s*\d{2}'

columns:
  register:
    - mark
    - type
    - serial
    - year
    - owner
    - owner_addr
    - operator
    - operator_addr
    - reg_date
    - arc_expiry
    - arc_issue

# No certificate number or sequence column is published, so the mark is the only key available. It
# is unique bar one self-contradiction: HA-MEI is printed as both a 1980 and a 2017 registration,
# which resolves on the newer certification_date rather than needing `duplicate_conflict`.
source_id: mark
source_id_transform: hu_kh_registration
# The HU-nn line is not an HA- registration, so the mark transform nulls it. A budget, not a blanket:
# a new kind of line past three fails the run instead of dropping rows quietly.
allowed_missing_source_id_rows:
  max: 3
  field: mark
  pattern: '^HU\s*-\s*\d{2}$'
registration: mark

mapping:
  registration:
    field: mark
    transform: hu_kh_registration

  icao_hex:
    constant: ~

  icao_type_code:
    constant: ~

  # No per-row status column, and the register never states that a listed mark is in good standing.
  status:
    constant: unknown

  country:
    constant: HU

  # "Légijármű típusa" holds a bare model ("MTO SPORT") or maker and model together ("ANTONOV AN-2
  # TD"), with no maker list published to split them on — so it maps whole to `model`.
  manufacturer:
    constant: ~

  model:
    field: type
    transform: collapse_ws_or_null

  serial_number:
    field: serial
    transform: collapse_ws_or_null

  year_manufactured:
    field: year
    transform: int_or_null

  # A build the register states as a span ("1957/58", "1959-61") nulls year_manufactured, so it is
  # kept verbatim here rather than lost or narrowed to one end of the range.
  year_manufactured_range:
    field: year
    transform: hu_kh_year_range_or_null

  airframe_type:
    constant: ~

  category:
    constant: ~

  build_certification:
    constant: ~

  airworthiness_class:
    constant: ~

  operating_environment:
    constant: ~

  operational_classes:
    constant: ~

  engine.manufacturer:
    constant: ~

  engine.model:
    constant: ~

  engine.type:
    constant: ~

  engine.count:
    constant: ~

  engine.horsepower:
    constant: ~

  engine.thrust_lbs:
    constant: ~

  owner.name:
    field: owner
    transform: collapse_ws_or_null

  owner.kind:
    field: owner
    transform: hu_kh_party_kind

  # Both address columns are street/postal detail, dropped as PII with nothing read out of them. The
  # country appears as a leading postal prefix ("A-2353 GUNTRANSDORF"), mid-string ("…, RO 505600"),
  # or not at all — never as a trailing component, so reading one would mean guessing.
  owner.state:
    constant: ~

  owner.country:
    constant: ~

  # A party in its own right: the operator column often names someone other than the owner.
  operator.name:
    field: operator
    transform: collapse_ws_or_null

  operator.kind:
    field: operator
    transform: hu_kh_party_kind

  operator.state:
    constant: ~

  operator.country:
    constant: ~

  legal_owner.name:
    constant: ~

  legal_owner.kind:
    constant: ~

  legal_owner.state:
    constant: ~

  legal_owner.country:
    constant: ~

  idera_authorised_party:
    constant: ~

  certification_date:
    field: reg_date
    transform: hu_kh_date_or_null

  airworthiness_date:
    field: arc_issue
    transform: hu_kh_date_or_null
    null_values: ['-']

  expiration_date:
    constant: ~

  last_action_date:
    constant: ~

  cruise_speed_ktas:
    constant: ~

  max_takeoff_weight_kg:
    constant: ~

  seats:
    constant: ~

  max_passengers:
    constant: ~

  min_crew:
    constant: ~

  airworthiness_review_date:
    field: arc_expiry
    transform: hu_kh_date_or_null
    null_values: ['-']

  cancellation_reason:
    constant: ~

  lien_status:
    constant: ~

  interdiction_code:
    constant: ~
