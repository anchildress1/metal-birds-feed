id: nl-ilt
label: Netherlands ILT Civil Aircraft Register
country: NL
language: en
encoding: utf8
trim_all: true
# cadence_days intentionally absent: ILT publishes on an irregular schedule
# (continuous-to-monthly, no fixed date). Running daily and letting the content-hash
# diff detect actual changes is correct — guessing a cadence window would miss updates.
format: ods
sheet: 0
# ILT's first sheet ships with annotated headers like
# "Flag [details=n][kolom=j][filter=j][kolom_breedte=s]"; the bracket suffixes are
# editor metadata. The clean column names are supplied via `columns:` below; this
# `skip_rows: 1` discards the file's own (annotated) header row so the first row
# the engine sees is genuine data (the "Information" banner, then aircraft).
skip_rows: 1

download:
  url: https://www.ilent.nl/site/binaries/site-content/collections/documents/lijsten/luchtvaart/databestanden/luchtvaartregister-data/luchtvaartuigregister.ods
  format: file
  entries:
    register: '.'
  headers:
    User-Agent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
  discover_url: https://www.ilent.nl/documenten/lijsten/luchtvaart/databestanden/luchtvaartregister-data
  discover_pattern: 'href="(https://www\.ilent\.nl/site/binaries/[^"]+luchtvaartuigregister[^"]+\.ods)"'

primary: register
delimiter: ','

# ILT's first sheet ships with annotated headers like
# "Flag [details=n][kolom=j][filter=j][kolom_breedte=s]"; the bracket suffixes are
# editor metadata. Supply the clean column names directly so the engine's lookups are
# stable across refreshes (ILT periodically tweaks the bracket annotations) and the
# rest of this config can reference fields without the metadata noise.
columns:
  register:
    - Flag
    - Registration
    - Registered
    - LatestOwnerChange
    - PrevCountry
    - PrevMark
    - Manufacturer
    - ManufacturedIn
    - Model
    - Serial
    - X-Ponder
    - Built
    - Group
    - Configuration
    - MTOM
    - MLM
    - ICAO-code
    - AOC
    - 83Bis
    - Representative
    - Mortgage
    - Volume
    - LegalBase
    - Engines
    - EngKind
    - EngManufacturer
    - EngModel
    - Props
    - PropKind
    - PropManufacturer
    - PropModel
    - NoiseRequirements
    - NoiseCat
    - NoiseRcrd
    - LevelApp
    - LevelFo
    - LevelOf
    - LevelSl
    - LevelTo
    - RegistrIssued
    - RegistrExpiry
    - CofA
    - AirwIssued
    - AirwExpiry
    - AirwKind
    - AirwVal
    - NoiseIssued
    - NoiseExpiry
    - RegBlock
    - Site2Title
    - Site2Descr1
    - Site2Descr2
    - Site2Tech1
    - Site2Tech2
    - Site2Tech3
    - Site2Tech4
    - Site2Tech5
    - Site2Noise1
    - Site2Noise2
    - Site2Doc1
    - Site2Doc2
    - Site2Doc3
# Annotations included: a changed annotation fails the run until this list is updated.
header_text:
  - 'Flag [details=n][kolom=j][filter=j][kolom_breedte=s]'
  - 'Registration [details=n][kolom=j][filter=n][kolom_breedte=s]'
  - 'Registered [details=n][kolom=o][filter=n]'
  - 'LatestOwnerChange [details=n][kolom=o][filter=n]'
  - 'PrevCountry [details=n][kolom=o][filter=n]'
  - 'PrevMark [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'Manufacturer [details=n][kolom=j][filter=j]'
  - 'ManufacturedIn [details=n][kolom=o][filter=n]'
  - 'Model [details=n][kolom=j][filter=j]'
  - 'Serial [details=n][kolom=j][filter=n]'
  - 'X-Ponder [details=n][kolom=o][filter=n]'
  - 'Built [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'Group [details=n][kolom=j][filter_label=Group]'
  - 'Configuration [details=n][kolom=j]'
  - 'MTOM [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'MLM [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'ICAO-code [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'AOC [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - '83Bis [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'Representative [ kolom=n][details=n][filter_label=Representative in NL]'
  - 'Mortgage [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'Volume [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LegalBase [details=n][kolom=o][filter_label=Legal base]'
  - 'Engines [details=n][kolom=o][filter=j][kolom_breedte=xs]'
  - 'EngKind [details=n][kolom=o][filter=n]'
  - 'EngManufacturer [details=n][kolom=o][filter=n]'
  - 'EngModel [details=n][kolom=o][filter=n]'
  - 'Props [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'PropKind [details=n][kolom=o][filter=n]'
  - 'PropManufacturer [details=n][kolom=o][filter=n]'
  - 'PropModel [details=n][kolom=o][filter=n]'
  - 'NoiseRequirements [details=n][kolom=o][filter=n]'
  - 'NoiseCat [details=n][kolom=o][filter=n][kolom_breedte=xs]'
  - 'NoiseRcrd [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LevelApp [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LevelFo [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LevelOf [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LevelSl [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'LevelTo [details=n][kolom=o][filter=n][kolom_breedte=s]'
  - 'RegistrIssued [details=n][kolom=o][filter=n]'
  - 'RegistrExpiry [details=n][kolom=o][filter=n]'
  - 'CofA (Form24/25)_Iss. [details=n][kolom=o][filter=n][kolom'
  - 'AirwIssued [details=n][kolom=o][filter=n]'
  - 'AirwExpiry [details=n][kolom=j][filter=n]'
  - 'AirwKind [details=n][kolom=o][filter=n]'
  - 'AirwVal [details=n][kolom=o][filter_label=Airworthiness valid]'
  - 'NoiseIssued [details=n][kolom=o][filter=n]'
  - 'NoiseExpiry [details=n][kolom=o][filter=n]'
  - 'RegBlock [filter=j][kolom=o][details=n][filter_label=Registration block]'
  - 'Site2Title [details=j][kolom=n][detail_label=Mark - manufacturer - model:][filter=n][titel=j]'
  - 'Site2Descr1 [details=i][kolom=n][detail_label=Serial, built:][filter=n]'
  - 'Site2Descr2 [details=i][kolom=n][detail_label=Registration data:][filter=n]'
  - 'Site2Tech1 [details=i][kolom=n][detail_label=Technical data:][filter=n]'
  - 'Site2Tech2 [details=i][kolom=n][detail_label=Grouping:][filter=n]'
  - 'Site2Tech3 [details=i][kolom=n][detail_label=Masses:][filter=n]'
  - 'Site2Tech4 [details=i][kolom=n][detail_label=Engine(s):][filter=n]'
  - 'Site2Tech5 [details=i][kolom=n][detail_label=Propeller(s):][filter=n]'
  - 'Site2Noise1 [details=i][kolom=n][detail_label=Noise reference:][filter=n]'
  - 'Site2Noise2 [details=i][kolom=n][detail_label=Noise level(s):][filter=n]'
  - 'Site2Doc1 [details=i][kolom=n][detail_label=Document registration:][filter=n]'
  - 'Site2Doc2 [details=j][kolom=n][detail_label=Document airworthiness:][filter=n]'
  - 'Site2Doc3 [details=i][kolom=n][detail_label=Document noise:][filter=n]'

# ILT sticks an "1 Info" banner in the first data row of the export. The
# nl_ilt_registration_or_null transform makes source_id null for the banner row, and
# the bound below permits exactly one such skip — anything more (multiple banners,
# corrupted export) fails loudly.
source_id: Registration
source_id_transform: nl_ilt_registration_or_null
allowed_missing_source_id_rows:
  max: 1
  field: Registration
  pattern: '^Information$'

joins: []

registration: Registration

mapping:
  registration:
    field: Registration
    transform: nl_ilt_registration_or_null
    default: ''

  icao_hex:
    field: X-Ponder
    transform: lowercase

  icao_type_code:
    field: ICAO-code
    transform: trim_or_null

  status:
    field: Flag
    transform: trim_or_null
    lookup:
      '5 -': valid
      '3 New': valid
      '4 Changed': valid
      '2 Deregistered': cancelled
    default: other

  country:
    constant: NL

  manufacturer:
    field: Manufacturer
    transform: trim_or_null

  model:
    field: Model
    transform: trim_or_null

  serial_number:
    field: Serial
    transform: trim_or_null

  year_manufactured:
    field: Built
    transform: int_or_null

  airframe_type:
    fields:
      - Group
      - Engines
    compound_transform: nl_ilt_airframe

  category:
    constant: ~

  build_certification:
    constant: ~

  airworthiness_class:
    field: AirwKind
    transform: trim_or_null

  operating_environment:
    constant: ~

  operational_classes:
    constant: ~

  engine.manufacturer:
    field: EngManufacturer
    transform: trim_or_null

  engine.model:
    field: EngModel
    transform: trim_or_null

  engine.type:
    field: EngKind
    transform: trim_or_null
    lookup:
      'Reciprocating piston-driven engine': reciprocating
      'Reciprocating piston-driven Diesel engine': reciprocating
      'Reciprocating piston radial engine': reciprocating
      'Piston-driven shaft (rotorcraft) engine': reciprocating
      'Turbofan engine': turbo-fan
      'Turbojet engine': turbo-jet
      'Turbine-driven shaft (rotorcraft) engine': turbo-shaft
      'Turbo-prop engine': turbo-prop
      'Turbine-driven propeller engine': turbo-prop
      'Electrical engine': electric
      'Wankel engine': rotary
      'No engine': none
      # ILT's explicit "we did not record this" label — distinct from 'No engine', which asserts
      # the aircraft has none.
      'Engine - not defined': unknown
    default: ~

  engine.count:
    field: Engines
    transform: int_or_null

  engine.horsepower:
    constant: ~

  engine.thrust_lbs:
    constant: ~

  # ILT does not publish owner identity in the bulk register (privacy policy). Owner
  # name, kind, and state stay null; country is constant NL since this is the Dutch
  # register.
  owner.name:
    constant: ~

  owner.kind:
    constant: ~

  owner.state:
    constant: ~

  owner.country:
    constant: NL

  certification_date:
    field: CofA
    transform: iso_date_only_or_null

  airworthiness_date:
    field: AirwIssued
    transform: iso_date_only_or_null

  expiration_date:
    field: AirwExpiry
    transform: iso_date_only_or_null

  last_action_date:
    field: LatestOwnerChange
    transform: iso_date_only_or_null

  cruise_speed_ktas:
    constant: ~
